<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prachi Singh | Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="brand">Prachi Singh</a>
        <nav>
            <ul class="nav-list">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="main-wrap">
        <section class="page-banner">
            <h1>Contact</h1>
            <p>Send a message below for internship opportunities or project collaborations.</p>
        </section>

        <section class="contact-grid">
            <div class="contact-details">
                <h3>Contact Information</h3>
                <p><strong>Location:</strong> Surat, Gujarat, India</p>
                <p><strong>Email:</strong> <a href="mailto:prachi151211@gmail.com">prachi151211@gmail.com</a></p>
                <p><strong>GitHub:</strong> <a href="https://github.com" target="_blank">://github.com</a></p>
            </div>

            <form class="contact-form">
                <div class="input-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Your full name" required>
                </div>
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Your email address" required>
                </div>
                <div class="input-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="4" placeholder="Write your message here" required></textarea>
                </div>
                <button type="submit" class="btn primary-btn full-btn">Send Message</button>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Prachi Singh</p>
        <div class="footer-links">
            <a href="https://github.com" target="_blank">GitHub</a>
            <a href="https://linkedin.com" target="_blank">LinkedIn</a>
        </div>
    </footer>

</body>
</html>
