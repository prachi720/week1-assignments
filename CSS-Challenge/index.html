<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CSS Challenge</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <!--flexbox container-->
        <h2 class="challenge-title">Exercise-1 : Flexbox Responsive Row</h2>
        <section class="flex-container">
            <div class="card">card 1</div>
            <div class="card">card 2</div>
            <div class="card">card 3</div>
        </section>
        <!--grid gallery-->
        <h2 class="challenge-title">Exercise-2 : CSS Grid Responsive Matrix</h2>
        <section class="grid-container">
            <div class="grid-item">Gallery Item 1</div>
            <div class="grid-item">Gallery Item 2</div>
            <div class="grid-item">Gallery Item 3</div>
            <div class="grid-item">Gallery Item 4</div>
            <div class="grid-item">Gallery Item 5</div>
            <div class="grid-item">Gallery Item 6</div>
        </section>
        <!--Micro-Interaction Automation-->
        <h2 class="challenge-title">Exercise-3 : Smooth Interaction states</h2>
        <section class="animation-container">
            <button class="animated-btn">Hover /FocusMe</button>
            <div class="spinning-loader"></div>
        </section>
    </body>
</html>
